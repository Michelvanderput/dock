name: Build GlassDock

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Kies de nieuwste Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Bouw GlassDock.app (universal)
        run: ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GlassDock
          path: build/GlassDock.zip

      - name: UI-test met echte muisklikken
        run: |
          mkdir -p shots
          swiftc -O scripts/ui-probe.swift -o build/ui-probe
          GLASSDOCK_DEBUG=1 build/GlassDock.app/Contents/MacOS/GlassDock > shots/app.log 2>&1 &
          sleep 8
          set +e
          build/ui-probe
          STATUS=$?
          echo "---- app log ----"
          cat shots/app.log
          cp /tmp/glassdock-debug.json shots/ 2>/dev/null
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test
          path: shots
